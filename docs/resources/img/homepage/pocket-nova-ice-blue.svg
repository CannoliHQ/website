<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" fill="none">
  <defs>
    <linearGradient id="nova-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shoulder triggers (peek above body silhouette) -->
  <rect x="55" y="5" width="85" height="14" rx="5" ry="5" fill="#9ec8d3"/>
  <rect x="340" y="5" width="85" height="14" rx="5" ry="5" fill="#9ec8d3"/>

  <!-- Translucent ice blue body -->
  <rect x="8" y="15" width="464" height="210" rx="20" ry="20" fill="#b9dfe8"/>

  <!-- Internal hints visible through translucent body (wing areas only) -->
  <g opacity="0.35">
    <!-- Left wing PCB rectangle -->
    <rect x="20" y="32" width="100" height="180" rx="3" fill="#5f9aa8"/>
    <!-- Right wing PCB rectangle -->
    <rect x="360" y="32" width="100" height="180" rx="3" fill="#5f9aa8"/>
  </g>
  <g opacity="0.55">
    <!-- Corner screws -->
    <circle cx="22" cy="29" r="2" fill="#4a7a85"/>
    <circle cx="458" cy="29" r="2" fill="#4a7a85"/>
    <circle cx="22" cy="211" r="2" fill="#4a7a85"/>
    <circle cx="458" cy="211" r="2" fill="#4a7a85"/>
  </g>

  <!-- Subtle edge stroke for translucent depth -->
  <rect x="8" y="15" width="464" height="210" rx="20" ry="20" fill="none" stroke="#6fb3c2" stroke-width="1.5"/>

  <!-- Screen bezel (dark frame around screen) -->
  <rect x="124" y="28" width="232" height="169" rx="7" ry="7" fill="#0a0a0e"/>

  <!-- Screen surface -->
  <rect x="130" y="32" width="220" height="161" rx="4" ry="4" fill="#141418"/>

  <!-- Screen glass reflection -->
  <rect x="130" y="32" width="220" height="161" rx="4" ry="4" fill="url(#nova-glare)" opacity="0.06"/>

  <!-- D-Pad (top-left) -->
  <g transform="translate(70, 65)">
    <path d="M-8,-26 L8,-26 Q10,-26 10,-24 L10,-8 L26,-8 Q28,-8 28,-6 L28,6 Q28,8 26,8 L10,8 L10,24 Q10,26 8,26 L-8,26 Q-10,26 -10,24 L-10,8 L-26,8 Q-28,8 -28,6 L-28,-6 Q-28,-8 -26,-8 L-10,-8 L-10,-24 Q-10,-26 -8,-26 Z" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="0.5"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#141418"/>
  </g>

  <!-- Face buttons (top-right, diamond, GameCube palette) -->
  <g transform="translate(410, 65)">
    <!-- X top (blue) -->
    <circle cx="0" cy="-22" r="11" fill="#4a8fd6" stroke="#3a6fa6" stroke-width="0.5"/>
    <text x="0" y="-18" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="600" opacity="0.75">X</text>
    <!-- A right (green) -->
    <circle cx="22" cy="0" r="11" fill="#5db14d" stroke="#458a3a" stroke-width="0.5"/>
    <text x="22" y="4" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="600" opacity="0.75">A</text>
    <!-- B bottom (red) -->
    <circle cx="0" cy="22" r="11" fill="#d64545" stroke="#a83434" stroke-width="0.5"/>
    <text x="0" y="26" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="600" opacity="0.75">B</text>
    <!-- Y left (yellow) -->
    <circle cx="-22" cy="0" r="11" fill="#e8c849" stroke="#b09533" stroke-width="0.5"/>
    <text x="-22" y="4" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="600" opacity="0.75">Y</text>
  </g>

  <!-- Left analog stick (bottom-left) -->
  <g transform="translate(75, 158)">
    <circle cx="0" cy="0" r="20" fill="#0e0e12" opacity="0.45"/>
    <circle cx="0" cy="0" r="16" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#141418"/>
  </g>

  <!-- Right analog stick (bottom-right) -->
  <g transform="translate(405, 158)">
    <circle cx="0" cy="0" r="20" fill="#0e0e12" opacity="0.45"/>
    <circle cx="0" cy="0" r="16" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#141418"/>
  </g>

  <!-- Speaker grilles (vertical slots on outer flanks beside sticks) -->
  <g fill="#4a7a85" opacity="0.55">
    <rect x="20" y="146" width="2" height="24" rx="1"/>
    <rect x="27" y="146" width="2" height="24" rx="1"/>
    <rect x="34" y="146" width="2" height="24" rx="1"/>
    <rect x="445" y="146" width="2" height="24" rx="1"/>
    <rect x="452" y="146" width="2" height="24" rx="1"/>
    <rect x="459" y="146" width="2" height="24" rx="1"/>
  </g>

  <!-- Select / Home / Start row, below screen -->
  <g transform="translate(240, 210)">
    <rect x="-34" y="-3.5" width="22" height="7" rx="3.5" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#147070" stroke="#126060" stroke-width="0.5"/>
    <rect x="12" y="-3.5" width="22" height="7" rx="3.5" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="0.5"/>
  </g>
</svg>
